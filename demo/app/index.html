<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>kurzclip</title>
<meta name="theme-color" content="#0c0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
/* Dunkle App-Optik wie in den Mockups. Rec-Rot als einziger Akzent. */
:root {
  --bg: #0c0e13;
  --card: #171a22;
  --line: #2a2f3a;
  --fg: #f3f4f7;
  --mute: #9aa1ae;
  --rec: #ff4655;
  --ok: #3ddc97;
  --warn: #ffc850;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #05060a;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; }

.app {
  max-width: 480px; margin: 0 auto; min-height: 100dvh; background: var(--bg);
  display: flex; flex-direction: column; position: relative;
  padding-top: env(safe-area-inset-top, 0px);
}
.main { flex: 1; display: flex; flex-direction: column; padding-bottom: 76px; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
.logo i { font-style: normal; color: var(--rec); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }

.top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 10px; gap: 10px; }
.chip {
  font-family: var(--f-mono); font-size: 11px; padding: 5px 10px; border-radius: 99px;
  background: rgba(61, 220, 151, .14); color: var(--ok); white-space: nowrap;
}
.chip.r { background: rgba(255, 70, 85, .16); color: var(--rec); }
.chip.dk { background: rgba(0, 0, 0, .55); }
.tabs { display: flex; gap: 18px; padding: 0 16px 12px; font-weight: 700; color: var(--mute); }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom: 2px solid var(--rec); padding-bottom: 4px; }

/* Video-Raster */
.vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px; }
.vc {
  aspect-ratio: 9 / 13; border-radius: 12px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 9px; gap: 2px; isolation: isolate;
}
.vc img.poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.vc::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.7)); }
.vc .d { position: absolute; top: 8px; right: 8px; font-family: var(--f-mono); font-size: 10.5px; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 5px; }
.vc .f { position: absolute; top: 8px; left: 8px; font-family: var(--f-mono); font-size: 10px; background: var(--ok); color: #06281a; padding: 2px 6px; border-radius: 5px; font-weight: 600; }
.vc .tt { font-weight: 700; font-size: 13px; line-height: 1.2; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.vc .vw { font-size: 11px; color: rgba(255,255,255,.8); }
.vc.lk img.poster, .vc.lk .bgx { filter: blur(8px) saturate(.7); transform: scale(1.15); }
.vc.lk .bgx { position: absolute; inset: 0; z-index: -2; }
.vc.lk .lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(8,10,14,.45); font-size: 12px; font-weight: 700; }
.lock svg { width: 22px; height: 22px; }

.g1 { background: linear-gradient(160deg,#f6a04d,#c2410c 55%,#3b1206); }
.g2 { background: linear-gradient(170deg,#7dd3fc,#2563eb 60%,#0b1a3d); }
.g3 { background: linear-gradient(150deg,#bef264,#16a34a 55%,#052e16); }
.g4 { background: linear-gradient(165deg,#f9a8d4,#be185d 60%,#3a0a1e); }
.g5 { background: linear-gradient(155deg,#fde68a,#d97706 55%,#3a2004); }
.g6 { background: linear-gradient(170deg,#c4b5fd,#6d28d9 60%,#1e0b3d); }

/* Untere Navigation */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
  display: flex; justify-content: space-around; align-items: center;
  padding: 8px 0 calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line);
  background: rgba(12,14,19,.96); backdrop-filter: blur(8px); font-size: 11px; color: var(--mute); z-index: 20;
}
.nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; }
.nav a svg { width: 22px; height: 22px; }
.nav a[aria-current="page"] { color: var(--fg); }
.nav .plus { width: 44px; height: 30px; border-radius: 9px; background: var(--rec); color: #fff; display: flex; align-items: center; justify-content: center; }
.nav .plus svg { width: 20px; height: 20px; }

/* Player */
.player { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: #000; overflow: hidden; }
.player video, .player .bgfill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.player .blur { filter: blur(14px) saturate(.6); transform: scale(1.15); }
.shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.4) 0%, transparent 20%, transparent 55%, rgba(0,0,0,.8) 100%); }
.player .top { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 3; }
.back { font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.side { position: absolute; right: 12px; bottom: 150px; display: flex; flex-direction: column; gap: 18px; align-items: center; z-index: 3; font-size: 12px; font-weight: 700; }
.side button, .side a { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.side svg { width: 30px; height: 30px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
.side .liked svg { color: var(--rec); }
.cap { position: absolute; left: 0; right: 0; bottom: 92px; padding: 0 72px 0 16px; z-index: 3; display: flex; flex-direction: column; gap: 6px; }
.who { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#ff4655,#ffb347); border: 2px solid #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex: none; color: #fff; }
.cap .title { font-weight: 700; font-size: 17px; }
.cap .desc { font-size: 13.5px; color: rgba(255,255,255,.88); }
.prog { position: absolute; left: 16px; right: 16px; bottom: 74px; height: 4px; background: rgba(255,255,255,.25); border-radius: 2px; z-index: 3; cursor: pointer; }
.prog i { display: block; height: 100%; background: #fff; border-radius: 2px; }
.time { position: absolute; left: 16px; right: 16px; bottom: 54px; display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: rgba(255,255,255,.85); z-index: 3; }
.tap { position: absolute; inset: 70px 0 160px 0; z-index: 2; }
.paused { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; pointer-events: none; }
.paused span { width: 70px; height: 70px; border-radius: 50%; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
.swipehint { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 10.5px; color: rgba(255,255,255,.55); z-index: 3; }

/* Bottom-Sheet (Paywall) */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 22px 22px 0 0; padding: 12px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; z-index: 4; border-top: 1px solid var(--line); }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
.sheet h2 { font-size: 22px; }
.sheet p { margin: 0; color: var(--mute); font-size: 14px; }
.dots { display: flex; gap: 5px; }
.dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--ok); }
.dots i.x { background: var(--rec); }
.plan { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; text-align: left; width: 100%; }
.plan[aria-pressed="true"] { border-color: var(--rec); background: rgba(255,70,85,.08); }
.plan b { font-size: 15px; }
.plan small { display: block; color: var(--mute); font-size: 12px; }
.plan .pr { font-family: var(--f-display); font-weight: 700; font-size: 19px; text-align: right; }
.badge { font-family: var(--f-mono); font-size: 10px; background: var(--rec); color: #fff; padding: 2px 6px; border-radius: 5px; margin-left: 6px; vertical-align: middle; }

.cta { display: block; width: 100%; background: var(--rec); color: #fff; font-weight: 700; text-align: center; border-radius: 14px; padding: 14px; font-size: 15px; }
.cta:disabled { opacity: .6; cursor: default; }
.cta.alt { background: transparent; border: 1.5px solid var(--line); color: var(--fg); font-weight: 400; }
.cta.sm { padding: 10px; font-size: 14px; border-radius: 12px; }
.fine { text-align: center; color: var(--mute); font-size: 12px; margin: 0; }
.err { background: rgba(255,70,85,.12); color: #ff8a93; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin: 0; }
.okmsg { background: rgba(61,220,151,.12); color: var(--ok); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin: 0; }

/* Formulare und Seiten */
.pad { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.inp { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.inp::placeholder { color: var(--mute); }
textarea.inp { resize: vertical; min-height: 72px; }
.lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.field { display: flex; flex-direction: column; gap: 6px; }
.pagehead { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 10px; }
.pagehead h1 { font-size: 22px; }

.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--mute); font-size: 12px; }
.lrow { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lrow .mini { width: 42px; height: 58px; border-radius: 8px; flex: none; overflow: hidden; }
.lrow .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lrow .meta { flex: 1; min-width: 0; }
.lrow b { display: block; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow small { color: var(--mute); font-size: 12.5px; }
.st { font-family: var(--f-mono); font-size: 10.5px; padding: 3px 8px; border-radius: 99px; background: rgba(61,220,151,.14); color: var(--ok); white-space: nowrap; }
.del { color: var(--mute); font-size: 12.5px; text-decoration: underline; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.muted { color: var(--mute); }
.empty { text-align: center; color: var(--mute); padding: 48px 24px; display: flex; flex-direction: column; gap: 14px; align-items: center; }

/* Login */
.auth { position: relative; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.mosaic { position: absolute; inset: -10% -20% 30%; display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; opacity: .55; transform: rotate(-8deg); }
.mosaic i { border-radius: 12px; aspect-ratio: 9/14; background-size: cover; background-position: center; }
.auth .fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,14,19,.15), var(--bg) 55%); }
.hero { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 20px calc(28px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
.hero h1 { font-size: 32px; line-height: 1.08; }
.hero p { margin: 0; color: rgba(255,255,255,.8); }
.or { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Upload */
.drop { border: 2px dashed var(--line); border-radius: 16px; padding: 34px 16px; text-align: center; color: var(--mute); display: flex; flex-direction: column; gap: 8px; align-items: center; cursor: pointer; }
.drop.over { border-color: var(--rec); background: rgba(255,70,85,.06); }
.drop b { color: var(--fg); font-size: 16px; }
.prev { border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 9/12; position: relative; }
.prev video { width: 100%; height: 100%; object-fit: cover; display: block; }
.trimbar { height: 40px; border-radius: 9px; display: flex; overflow: hidden; border: 2px solid var(--ok); background: var(--card); }
.trimbar.bad { border-color: var(--rec); }
.trimbar img { flex: 1; min-width: 0; height: 100%; object-fit: cover; border-right: 1px solid rgba(0,0,0,.4); }
.trimrow { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11.5px; color: var(--mute); margin-top: 6px; }
.trimrow b { color: var(--ok); font-weight: 600; }
.trimrow b.bad { color: var(--rec); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--rec); transition: width .2s; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* Demo-Ergänzungen */
[hidden]{display:none!important}
.app{padding-left:0;padding-right:0}
.demo{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--warn);background:rgba(255,200,80,.12);padding:3px 8px;border-radius:99px}
.scene{position:absolute;inset:0;overflow:hidden}
.scene i{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);animation:float 7s ease-in-out infinite}
.scene i:nth-child(1){width:46%;aspect-ratio:1;left:-8%;top:18%}
.scene i:nth-child(2){width:30%;aspect-ratio:1;right:6%;top:40%;animation-delay:-2s;animation-duration:9s;border-radius:22%}
.scene i:nth-child(3){width:20%;aspect-ratio:1;left:38%;top:62%;animation-delay:-4s;animation-duration:6s}
.scene b{position:absolute;left:8%;right:8%;top:30%;font-family:var(--f-display);font-size:34px;line-height:1.05;color:rgba(255,255,255,.92);text-shadow:0 2px 18px rgba(0,0,0,.25)}
.paused-scene .scene i{animation-play-state:paused}
@keyframes float{50%{transform:translate(18%,-14%) rotate(25deg) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.scene i{animation:none}}
.vc .mini-scene{position:absolute;inset:0;z-index:-2}
.toggle{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.toggle button{flex:1;padding:9px;border-radius:9px;color:var(--mute);font-weight:700}
.toggle button[aria-pressed="true"]{background:var(--card);color:var(--fg)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:50;font-size:14px}
.hint{font-size:13px;color:var(--mute);margin:0}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const FREE = 4;
const SEED = [
  { id: 1, title: "Pasta in 60 Sekunden", creator: "Lena Meyer", dur: 18, url: "videos/1.mp4", poster: "videos/1.jpg", views: 1240, likes: 318, g: "g1", desc: "Ein Topf, fünf Zutaten, fertig." },
  { id: 2, title: "Der beste Kaffee-Trick", creator: "Lena Meyer", dur: 18, url: "videos/2.mp4", poster: "videos/2.jpg", views: 860, likes: 122, g: "g2", desc: "So schmeckt Filterkaffee wie aus dem Café." },
  { id: 3, title: "3 Übungen fürs Büro", creator: "Lena Meyer", dur: 18, url: "videos/3.mp4", poster: "videos/3.jpg", views: 2410, likes: 401, g: "g3", desc: "Nacken, Schultern, Rücken. Ohne Matte, direkt am Schreibtisch." },
  { id: 4, title: "Messer richtig schärfen", creator: "Lena Meyer", dur: 18, url: "videos/4.mp4", poster: "videos/4.jpg", views: 730, likes: 96, g: "g4", desc: "Winkel halten, wenig Druck, zehn Züge pro Seite." },
  { id: 5, title: "Zwiebeln ohne Tränen", creator: "Lena Meyer", dur: 18, url: "videos/5.mp4", poster: "videos/5.jpg", views: 1530, likes: 210, g: "g5", desc: "Der Trick mit dem kalten Messer." },
  { id: 6, title: "Hemd in 20 Sekunden falten", creator: "Lena Meyer", dur: 18, url: "videos/6.mp4", poster: "videos/6.jpg", views: 3120, likes: 512, g: "g6", desc: "Nie wieder Knitter im Koffer." },
  { id: 7, title: "Pflanzen richtig gießen", creator: "Lena Meyer", dur: 18, url: "videos/7.mp4", poster: "videos/7.jpg", views: 510, likes: 64, g: "g3", desc: "Fingerprobe statt Kalender." },
  { id: 8, title: "Schneller einschlafen", creator: "Lena Meyer", dur: 18, url: "videos/8.mp4", poster: "videos/8.jpg", views: 1980, likes: 330, g: "g2", desc: "Die 4-7-8-Atmung in einer Minute erklärt." },
];

const store = {
  get(k, d) { try { const v = localStorage.getItem("kc_" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kc_" + k, JSON.stringify(v)); } catch {} },
};

const S = {
  route: { name: "feed", sort: "neu" },
  watched: store.get("watched", []),
  likes: store.get("likes", []),
  user: store.get("user", null),
  sub: store.get("sub", null),
  creatorMode: store.get("creator", false),
  extra: [], // im Browser hochgeladene Videos (nur bis zum Neuladen)
  plan: "monatlich",
};
const save = () => { store.set("watched", S.watched); store.set("likes", S.likes); store.set("user", S.user); store.set("sub", S.sub); store.set("creator", S.creatorMode); };

const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtD = (s) => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const fmtC = (n) => (n >= 1000 ? `${(n / 1000).toLocaleString("de-DE", { maximumFractionDigits: 1 })} Tsd.` : String(n));
const plural = (n, a, b) => `${fmtC(n)} ${n === 1 ? a : b}`;
const ini = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join("");

const videos = (sort = "neu") => {
  const all = [...S.extra, ...[...SEED].reverse()];
  return sort === "beliebt" ? [...all].sort((a, b) => b.views - a.views) : all;
};
const byId = (id) => videos().find((v) => v.id === id);
const subscribed = () => !!S.sub && new Date(S.sub.until) > new Date();
const unlimited = () => (S.user && S.creatorMode) || subscribed();
const freeLeft = () => Math.max(0, FREE - S.watched.length);
const state = (id) => (unlimited() || S.watched.includes(id) ? "open" : freeLeft() > 0 ? "free" : "locked");

const I = {
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  heart: (f) => `<svg viewBox="0 0 24 24" fill="${f ? "currentColor" : "#fff"}"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.3 5 6.6 5c2 0 3.6 1.1 4.4 2.6h2C13.8 6.1 15.4 5 17.4 5c3.3 0 5.6 3.3 4.1 6.8C19.5 16.4 12 21 12 21z"/></svg>`,
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v12M7 8l5-5 5 5"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="#fff" width="30" height="30"><path d="M8 5v14l11-7z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',

let cleanup = null;
function go(route) {
  if (cleanup) { cleanup(); cleanup = null; }
  S.route = route;
  render();
  window.scrollTo(0, 0);
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

const nav = (cur) => `
  <nav class="nav" aria-label="Hauptnavigation">
    <a href="#" data-go="feed" ${cur === "feed" ? 'aria-current="page"' : ""}>${I.home}Feed</a>
    <a href="#" data-go="beliebt" ${cur === "beliebt" ? 'aria-current="page"' : ""}>${I.flame}Beliebt</a>
    ${S.user && S.creatorMode ? `<a href="#" data-go="upload" aria-label="Neues Video"><span class="plus">${I.plus}</span></a>` : ""}
    <a href="#" data-go="gemerkt" ${cur === "gemerkt" ? 'aria-current="page"' : ""}>${I.book}Gemerkt</a>
    <a href="#" data-go="profil" ${cur === "profil" ? 'aria-current="page"' : ""}>${I.user}Profil</a>

const logo = (size) => `<span class="logo"${size ? ` style="font-size:${size}px"` : ""}>kurz<i>clip</i></span>`;
const thumb = (v) => (v.poster ? `<img class="poster" src="${v.poster}" alt="" loading="lazy">` : v.url ? `<video class="mini-scene" src="${v.url}" muted playsinline preload="metadata" style="object-fit:cover;width:100%;height:100%"></video>` : `<span class="mini-scene ${v.g}"></span>`);

function card(v) {
  const st = state(v.id);
  if (st === "locked") {
    return `<a href="#" class="vc lk" data-video="${v.id}" aria-label="${esc(v.title)}, nur mit Abo">${v.poster ? `<img class="poster" src="${v.poster}" alt="">` : `<span class="bgx ${v.g}"></span>`}<span class="d">${fmtD(v.dur)}</span><span class="lock">${I.lock}Mit Abo</span></a>`;
  }
  return `<a href="#" class="vc" data-video="${v.id}">${thumb(v)}${st === "free" ? '<span class="f">GRATIS</span>' : ""}<span class="d">${fmtD(v.dur)}</span><span class="tt">${esc(v.title)}</span><span class="vw">${plural(v.views, "Aufruf", "Aufrufe")}</span></a>`;
}

function chip() {
  if (unlimited()) return `<span class="chip">${S.user && S.creatorMode ? "Creator" : "Abo aktiv"}</span>`;
  if (freeLeft() > 0) return `<span class="chip">${freeLeft()} von ${FREE} gratis übrig</span>`;
  return `<a href="#" class="chip r" data-go="abo">Gratis-Videos aufgebraucht</a>`;
}

            : `<span class="muted">${S.creatorMode ? "Als Creator siehst du alle Videos kostenlos." : `Kein Abo. ${freeLeft()} von ${FREE} Gratis-Videos übrig.`}</span>${S.creatorMode ? "" : `<button class="cta sm" data-go="abo">Alle Videos freischalten</button>`}`}

    { k: "jaehrlich", l: "Jährlich", n: "2 Monate geschenkt", p: "39,99 €", per: "pro Jahr", b: "−33 %" },
  ];
  return `
    ${P.map((x) => `<button type="button" class="plan" data-plan="${x.k}" aria-pressed="${S.plan === x.k}"><div><b>${x.l}${x.b ? `<span class="badge">${x.b}</span>` : ""}</b><small>${x.n}</small></div><div class="pr">${x.p}<small>${x.per}</small></div></button>`).join("")}
    ${S.user
      ? `<button class="cta" id="pay" data-next="${videoId ?? ""}">Weiter zur Zahlung</button>`
      : `<button class="cta" data-auth="register" data-next="${videoId ?? ""}">Konto erstellen und freischalten</button><button class="cta alt" data-auth="login" data-next="${videoId ?? ""}">Schon ein Konto? Anmelden</button>`}
    <p class="fine">Testmodus: Es wird nichts abgebucht. In der echten App läuft die Zahlung über Stripe.</p>`;

function render() {
  const r = S.route;
  const html = r.name === "beliebt" ? views.feed() : (views[r.name] || views.feed)();
  app.innerHTML = html;
  if (r.name === "video") mountPlayer();
  if (r.name === "upload") mountUpload();
  if (r.name === "auth") mountAuth();
}

function mountPlayer() {
  const v = byId(S.route.id);
  const player = document.getElementById("player");
  if (!v || !player) return;
  const bar = document.getElementById("bar");
  const tEl = document.getElementById("t");
  const pausedEl = document.getElementById("paused");
  const vid = document.getElementById("vid");
  let paused = false, t = 0, last = performance.now(), raf;
  const setPaused = (p) => { paused = p; pausedEl.hidden = !p; player.classList.toggle("paused-scene", p); if (vid) { if (p) vid.pause(); else { vid.muted = false; vid.play().catch(() => {}); } } };
  if (vid) vid.play().catch(() => { vid.muted = true; vid.play().catch(() => setPaused(true)); });
  const tick = (now) => {
    if (!vid && !paused) { t = (t + (now - last) / 1000) % v.dur; }
    if (vid) t = vid.currentTime || 0;
    last = now;
    bar.style.width = `${Math.min(100, (t / v.dur) * 100)}%`;
    tEl.textContent = fmtD(t);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  document.getElementById("tap").onclick = () => setPaused(!paused);
  document.getElementById("like").onclick = (e) => {
    if (!S.user) { go({ name: "auth", mode: "login", next: v.id }); return; }
    const on = !S.likes.includes(v.id);
    S.likes = on ? [...S.likes, v.id] : S.likes.filter((x) => x !== v.id);
    save();
    const b = e.currentTarget;
    b.classList.toggle("liked", on);
    b.setAttribute("aria-pressed", on);
    b.innerHTML = `${I.heart(on)}<span>${v.likes + (on ? 1 : 0)}</span>`;
  };
  document.getElementById("share").onclick = async () => {
    try { if (navigator.share) { await navigator.share({ title: v.title, text: "Schau dir das auf kurzclip an" }); return; } } catch { return; }
    toast("Teilen klappt in der echten App mit eigenem Link.");
  };
  const list = videos();
  const idx = list.findIndex((x) => x.id === v.id);
  const step = (d) => { const n = list[idx + d]; if (n) go({ name: "video", id: n.id }); };
  let y0 = null;
  const ts = (e) => { y0 = e.touches[0].clientY; };
  const te = (e) => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy < -70) step(1); if (dy > 70) step(-1); };
  const key = (e) => { if (e.key === "ArrowDown") step(1); if (e.key === "ArrowUp") step(-1); if (e.key === " ") { e.preventDefault(); setPaused(!paused); } };
  player.addEventListener("touchstart", ts, { passive: true });
  player.addEventListener("touchend", te);
  window.addEventListener("keydown", key);
  cleanup = () => { cancelAnimationFrame(raf); window.removeEventListener("keydown", key); };
}

function mountAuth() {
  const f = document.getElementById("authform");
  f.onsubmit = (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const nameEl = document.getElementById("name");
    const err = document.getElementById("autherr");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = "Diese E-Mail-Adresse sieht nicht richtig aus."; err.hidden = false; return; }
    const name = nameEl ? nameEl.value.trim() : email.split("@")[0].replace(/^./, (c) => c.toUpperCase());
    S.user = { name: name || "Gast", email };
    save();
    const next = S.route.next;
    go(next ? { name: "video", id: Number(next) } : { name: "feed" });
  };
}

function mountUpload() {
  const input = document.getElementById("file");
  const pick = document.getElementById("pick");
  const err = document.getElementById("uperr");
  const pub = document.getElementById("publish");
  const title = document.getElementById("title");
  const drop = document.getElementById("drop");
  let picked = null;
  const showErr = (m) => { err.textContent = m; err.hidden = !m; };

  async function choose(file) {
    if (!file) return;
    showErr("");
    if (!file.type.startsWith("video/")) { showErr("Das ist keine Videodatei."); return; }
    pick.querySelector("b").textContent = "Video wird gelesen …";
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    try {
      await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(); setTimeout(rej, 15000); });
      if (!Number.isFinite(v.duration)) { v.currentTime = 1e7; await new Promise((r) => (v.ondurationchange = r)); }
    } catch {
      pick.querySelector("b").textContent = "Video auswählen oder aufnehmen";
      showErr("Dieses Video kann der Browser nicht lesen. Versuch ein anderes.");
      return;
    }
    const dur = v.duration;
    const frames = [];
    const c = document.createElement("canvas");
    c.width = 90; c.height = Math.round(90 * (v.videoHeight || 160) / (v.videoWidth || 90));
    const ctx = c.getContext("2d");
    for (let i = 0; i < 8; i++) {
      await new Promise((r) => { v.onseeked = r; v.currentTime = Math.min(dur - 0.05, (dur / 8) * (i + 0.5)); setTimeout(r, 1500); });
      try { ctx.drawImage(v, 0, 0, c.width, c.height); frames.push(c.toDataURL("image/jpeg", 0.6)); } catch { frames.push(""); }
    }
    const tooLong = dur > 60.5;
    picked = { url, dur };
    pick.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="prev"><video src="${url}" controls playsinline></video></div>
        <div>
          <div class="trimbar ${tooLong ? "bad" : ""}">${frames.map((f) => (f ? `<img src="${f}" alt="">` : "<span style='flex:1'></span>")).join("")}</div>
          <div class="trimrow"><span>0:00</span><b class="${tooLong ? "bad" : ""}">${fmtD(dur)} · ${tooLong ? "zu lang" : "passt"}</b><span>1:00</span></div>
        </div>
        ${tooLong ? `<p class="err">Das Video ist ${Math.round(dur)} Sekunden lang. Kürze es auf höchstens eine Minute, zum Beispiel in der Fotos-App, und wähle es dann neu aus.</p>` : ""}
        <button class="del" style="align-self:flex-start" data-go="upload">Anderes Video wählen</button>
      </div>`;
    if (!title.value) title.value = file.name.replace(/\.[^.]+$/, "").slice(0, 80);
    pub.disabled = tooLong;
  }

  input.onchange = () => choose(input.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); choose(e.dataTransfer.files[0]); };

  pub.onclick = () => {
    if (!picked) return;
    if (!title.value.trim()) { showErr("Bitte gib dem Video einen Titel."); return; }
    showErr("");
    pub.disabled = true;
    const prog = document.getElementById("upprog");
    const barEl = document.getElementById("upbar");
    prog.hidden = false;
    let p = 0;
    const iv = setInterval(() => {
      p = Math.min(100, p + 9);
      barEl.style.width = p + "%";
      document.getElementById("uptxt").textContent = p < 100 ? `Wird hochgeladen … ${p} %` : "Wird gespeichert …";
      if (p >= 100) {
        clearInterval(iv);
        S.extra.unshift({
          id: Date.now(), title: title.value.trim(), desc: document.getElementById("desc").value.trim(),
          creator: S.user?.name || "Creator", dur: picked.dur, views: 0, likes: 0, g: "g5", url: picked.url,
        });
        go({ name: "studio" });
        toast("Video veröffentlicht");
      }
    }, 120);
  };
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-video],[data-auth],[data-plan],[data-mode],#pay,#logout,#reset,#endsub");
  if (!el) return;
  e.preventDefault();
  if (el.dataset.go) {
    const g = el.dataset.go;
    if (g === "feed") return go({ name: "feed", sort: "neu" });
    if (g === "beliebt") return go({ name: "feed", sort: "beliebt" });
    if ((g === "upload" || g === "studio") && !(S.user && S.creatorMode)) return go({ name: "profil" });
    return go({ name: g });
  }
  if (el.dataset.video) return go({ name: "video", id: Number(el.dataset.video) });
  if (el.dataset.auth) return go({ name: "auth", mode: el.dataset.auth, next: el.dataset.next || S.route.next || null });
  if (el.dataset.plan) {
    S.plan = el.dataset.plan;
    document.querySelectorAll("[data-plan]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.plan === S.plan));
    return;
  }
  if (el.dataset.mode) { S.creatorMode = el.dataset.mode === "1"; save(); return render(); }
  if (el.id === "pay") {
    el.disabled = true;
    el.textContent = "Einen Moment …";
    setTimeout(() => {
      const until = new Date();
      until.setMonth(until.getMonth() + (S.plan === "jaehrlich" ? 12 : 1));
      S.sub = { plan: S.plan, until: until.toISOString() };
      save();
      go({ name: "erfolg", next: el.dataset.next || null });
    }, 700);
    return;
  }
  if (el.id === "logout") { S.user = null; S.creatorMode = false; save(); return go({ name: "feed" }); }
  if (el.id === "endsub") { S.sub = null; save(); return render(); }
  if (el.id === "reset") {
    S.watched = []; S.likes = []; S.user = null; S.sub = null; S.creatorMode = false; S.extra = [];
    save();
    toast("Demo zurückgesetzt");
    return go({ name: "feed" });
  }
});

render();

</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});</script>
