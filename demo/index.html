<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=app/">
<title>kurzclip</title>
<script>
// Alten Service Worker unter /kurzclip/ entfernen, dann zur App weiterleiten.
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (!r.scope.endsWith("/app/")) r.unregister(); }));
location.replace("app/");
</script>
</head>
<body style="background:#0c0e13;color:#f3f4f7;font-family:system-ui;padding:24px">
<a href="app/" style="color:#ff4655">Weiter zu kurzclip</a>
</body>
</html>
